    <script>
      // /lp: começa a baixar as imagens do topo antes do JavaScript da página chegar (4G).
      if (location.pathname.replace(/\/+$/, '') === '/lp') {
        ['/lp/screen-inicio.webp', '/lp/livro.webp'].forEach(function (href) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.href = href
          l.setAttribute('fetchpriority', 'high')
          document.head.appendChild(l)
        })
      }
    </script>
